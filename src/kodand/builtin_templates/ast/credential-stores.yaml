id: AST03-CREDENTIAL-STORE
info:
  name: Credential Store Access
  severity: high
  confidence: medium
  category: AST03
detection:
  match:
  - .git-credentials
  - gh/hosts.yml
  - .docker/config.json
  - .pypirc
  regex:
  - (?:~|\$HOME|%USERPROFILE%)/\.(?:netrc|npmrc|yarnrc|pgpass|my\.cnf)\b
  - \b(?:cat|less|more|head|tail|type|source|grep|print|read|dump|load|show|send|upload)\b[^\n]{0,30}?(?<![\w.-])\.env(?:\.(?!example|sample|template|dist|defaults)[\w-]+)?(?![\w.-])
  - \bprintenv\b(?!\s+(?:PATH|HOME|PWD|SHELL|USER|LANG|TERM|NODE_ENV)\b)
  - \benv\s*\|\s*(?:sort|grep|curl|nc|tee|base64)
  - \bset\s*\|\s*(?:grep|curl|nc)
  - \b(?:dump|print|list|show|send|upload|post|collect|export)\b[^\n]{0,20}?\b(?:all\s+)?(?:the\s+)?(?:environment\s+variables|env\s+vars)\b
  - (?:Google/Chrome|google-chrome|chromium|BraveSoftware|Microsoft/Edge|Mozilla/Firefox|\.mozilla/firefox)[^\n]{0,80}(?:Login\s+Data|Cookies|logins\.json|key4\.db|Local\s+State)
  - \bsecurity\s+(?:find|dump)-(?:generic|internet)-password\b|\bsecurity\s+dump-keychain\b
  - \bsecret-tool\s+lookup\b|\bkeyring\s+get\b
capabilities:
- credential-access
- secret-output
risk:
  title: Credential Store Access
recommendation: Skills must not read credential stores (.env files, ~/.netrc, ~/.npmrc, Docker/GitHub CLI
  credentials, browser profiles, the OS keychain) or dump the environment. Pass the one scoped secret a task
  needs through the platform's secret mechanism instead.
