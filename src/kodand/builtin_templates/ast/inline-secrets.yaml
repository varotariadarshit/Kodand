id: AST03-INLINE-SECRET
info:
  name: Hardcoded Secret or Token
  severity: high
  confidence: medium
  category: AST03
detection:
  regex:
  - \bsk_live_[0-9a-zA-Z]{16,}
  - \bsk-(?:proj|ant|live|svcacct)-[A-Za-z0-9_-]{16,}
  - \bglpat-[A-Za-z0-9_-]{20,}
  - \bnpm_[A-Za-z0-9]{36}\b
  - \bgithub_pat_[A-Za-z0-9_]{22,}
  - \bgh[ousr]_[A-Za-z0-9]{36}\b
  - \bAIza[0-9A-Za-z_-]{35}\b
  - \bhf_[A-Za-z0-9]{30,}\b
  - \bxapp-\d-[A-Za-z0-9-]{20,}
  - '-----BEGIN (?:RSA |EC |OPENSSH |DSA |PGP |ENCRYPTED )?PRIVATE KEY-----'
  - (?<![\w-])["']?(?:password|passwd|pwd|secret|client_secret|api_?key|access_?token|auth_?token|private_?key)["']?\s*[:=]\s*["'](?![<{$%]|your|xxx|\*\*\*|changeme|change-me|placeholder|example|redacted|none["'])[^"'\s]{6,}["']
capabilities:
- credential-access
risk:
  title: Hardcoded Secret
recommendation: Remove the credential from the skill, rotate it, and load secrets from the environment or a
  secret manager at run time. Even sample or test credentials in a skill get copied into agent context and
  real configs.
