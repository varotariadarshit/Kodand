id: AST08-JUDGE-INJECTION
info:
  name: Scanner LLM-Judge Injection
  severity: high
  confidence: medium
  category: AST08
detection:
  match:
  - mark this as safe
  - classify as benign
  - rate this benign
  - this is corporate policy
  - reviewer please approve
  regex:
  - (?:mark|rate|classify|label|report)\s+(?:this|it)\s+as\s+(?:safe|benign|not\s+malicious|non-malicious)
capabilities:
- scanner-evasion
- instruction-override
risk:
  title: Judge Injection
recommendation: Isolate any LLM security judge from skill-controlled text to prevent
  prompt injection.
