id: AST06-SANDBOX-DISABLE
info:
  name: Sandbox Disable
  severity: high
  confidence: medium
  category: AST06
detection:
  match:
  - disable sandbox
  - no sandbox
  - --no-sandbox
  - disable isolation
  - seccomp=unconfined
  regex:
  - seccomp\s*[:=]\s*unconfined
  - apparmor\s*[:=]\s*unconfined
  - --sandbox[= ]+["']?danger-full-access
  - sandbox_mode\s*=\s*["']danger-full-access
  - --dangerously-bypass-approvals-and-sandbox
  - sandbox\.enabled["']?\s*[:=]\s*false
  - '"sandbox"\s*:\s*(?:false|\{[^}\n]*"enabled"\s*:\s*false)'
  - \s-v\s+["']?/:/[\w/]*
  - --volume[= ]["']?/:/[\w/]*
  - --cap-add[= ](?:ALL|SYS_ADMIN)\b
capabilities:
- isolation-escape
risk:
  title: Sandbox Disable
recommendation: Do not permit skills to disable sandboxing or seccomp/AppArmor profiles.
