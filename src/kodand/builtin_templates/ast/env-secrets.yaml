id: AST03-ENV-SECRETS
info:
  name: Environment / Dotenv Secret Access
  severity: high
  confidence: medium
  category: AST03
detection:
  match:
  - .env.production
  - export secret
  regex:
  - export\s+\w*(?:secret|token|password|api[_-]?key)\w*\s*=
capabilities:
- credential-access
- environment-access
risk:
  title: Environment Secret Access
recommendation: Prevent skills from reading .env files or dumping environment secrets.
