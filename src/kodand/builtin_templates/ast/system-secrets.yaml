id: AST03-SYSTEM-SECRETS
info:
  name: System Secret File Access
  severity: high
  confidence: high
  category: AST03
detection:
  match:
  - /etc/passwd
  - /etc/shadow
  - private key
  - secret key
  regex:
  - (?:private|secret|master)[_ -]?key\s*[:=]
capabilities:
- credential-access
- filesystem-read
risk:
  title: System Secret Access
recommendation: Block skill access to OS secret stores and generic credential material.
