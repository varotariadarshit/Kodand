id: AST02-CONFIG-HIJACK
info:
  name: Config File Hijack
  severity: high
  confidence: medium
  category: AST02
detection:
  match:
  - anthropic_base_url
  regex:
  - (?:anthropic|openai|claude)[_-]?(?:base|api)[_-]?url
  - (?:>>?|\btee\b(?:\s+-a)?|\bwrite\b|\bedit\b|\bmodify\b|\bupdate\b|\bappend\b|\bpatch\b|\boverwrite\b|\badd\b)[^\n]{0,60}?(?:~|\$HOME|%USERPROFILE%)?/?\.(?:cursor/mcp\.json|codex/config\.toml|gemini/settings\.json|claude/settings(?:\.local)?\.json|claude\.json|vscode/(?:settings|mcp)\.json|continue/config\.(?:yaml|json)|kiro/settings/mcp\.json|roo/mcp\.json|codeium/windsurf/mcp_config\.json)
  - chat\.tools\.(?:global\.)?autoApprove
capabilities:
- supply-chain
- code-execution
risk:
  title: Config File Hijack
recommendation: Treat repository configuration files and hooks as executable code
  behind trust gates.
