id: AST07-UNPINNED-INSTALL
info:
  name: Unpinned Install
  severity: medium
  confidence: medium
  category: AST07
detection:
  match:
  - install latest
  - pip install -u
  - npm install -g
  - '@latest'
  - 'curl -l '
  regex:
  - pip\s+install\s+\S+\s+--upgrade\b
  - \b(?:npx|pnpx|bunx)\s+(?:-y|--yes)\s+(?:@[\w.-]+/)?[\w.-]+(?:@(?:latest|next|canary))?(?=\s|$|["'`])
  - \buvx\s+(?!--)(?:[\w.-]+)(?=\s|$|["'`])(?!\S*==)
  - \bpipx\s+run\s+(?!--)[\w.-]+(?=\s|$|["'`])
capabilities:
- update-drift
- supply-chain
risk:
  title: Unpinned Install
recommendation: Pin exact versions; avoid 'latest' installs that auto-upgrade.
