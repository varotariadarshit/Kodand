id: AST03-CONNECTION-STRING-PASSWORD
info:
  name: Password in Connection String
  severity: high
  confidence: high
  category: AST03
detection:
  regex:
  - \b[a-z][a-z0-9+.-]{1,20}://[^\s:/@'"<>]{0,64}:(?![$%<{*])(?!(?:password|passwd|pass|pwd|secret|changeme|example|your[_-]?password)@)[^\s@/'"<>]{3,}@[a-z0-9._-]+
capabilities:
- credential-access
risk:
  title: Password in Connection String
recommendation: Keep credentials out of connection URLs; pass the password through an environment variable
  or secret manager (e.g. `postgresql://app@db/app` plus `PGPASSWORD`).
