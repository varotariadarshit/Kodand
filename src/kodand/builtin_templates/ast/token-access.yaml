id: AST03-TOKEN-ACCESS
info:
  name: API Token / OAuth Access
  severity: high
  confidence: medium
  category: AST03
detection:
  match:
  - oauth token
  - personal access token
  regex:
  - github_token["']?\s*[:=]\s*["']?(?![$%<{])[A-Za-z0-9_-]{8,}
  - ghp_[A-Za-z0-9]{36}
  - xox[baprs]-[A-Za-z0-9-]{10,}
  - api[_ -]?key\s*[:=]\s*['"]?[A-Za-z0-9_-]{16,}
  - bearer\s+[A-Za-z0-9._-]{20,}
capabilities:
- credential-access
- secret-output
risk:
  title: API Token Access
recommendation: Skills must request scoped, short-lived tokens, never read stored
  tokens.
