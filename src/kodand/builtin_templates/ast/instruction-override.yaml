id: AST01-INSTRUCTION-OVERRIDE
info:
  name: Instruction Override Attempt
  severity: high
  confidence: high
  category: AST01
detection:
  match:
  - ignore previous instructions
  - ignore all previous instructions
  - disregard prior instructions
  - override system instructions
  - disregard the system prompt
  - forget your instructions
  regex:
  - (?:ignore|disregard|forget|override)\s+(?:all\s+)?(?:the\s+)?(?:previous|prior|earlier|system|your|operator'?s?)\s+instructions?
  - \b(?:ignore|disregard|forget|override|bypass)\s+(?:any|all|every)?\s*(?:of\s+)?(?:the\s+|your\s+|my\s+)?(?:above|previous|prior|earlier|preceding|existing|original|system|developer|safety|ethical|ethics|security|content|moral)\b[^.\n]{0,25}?\b(?:instructions?|rules|directions|guidelines|guidance|prompts?|constraints|policies|restrictions|guardrails|filters)\b
  - \b(?:ignore|disregard|forget)\s+everything\s+(?:above|before|previously|you\s+were\s+told)
  - \btakes?\s+precedence\s+over\s+(?:all|any|the|your)\s+(?:other\s+|previous\s+|prior\s+|system\s+){0,2}(?:instructions?|rules|prompts?|guidelines)
  - \bfrom\s+now\s+on,?\s+you\s+(?:are|will|must|should|have)\b
  - \byou\s+are\s+no\s+longer\s+(?:bound|an?\s+assistant|restricted|claude|chatgpt)
  - <\s*/?\s*(?:IMPORTANT|SYSTEM|ADMIN|INSTRUCTIONS?|SYSTEM_PROMPT)\s*>
  - \b(?:safety|security|ethical|content)\s+(?:rules|guidelines|policies|restrictions|guardrails|filters)\s+(?:are|is)\s+(?:now\s+|hereby\s+|temporarily\s+)?(?:suspended|disabled|lifted|removed|void|overridden|turned\s+off|no\s+longer\s+(?:apply|active|in\s+effect))
  - '\b(?:IMPORTANT|SYSTEM|ADMIN|ADMINISTRATOR|DEVELOPER|DEBUG)\s+OVERRIDE\s*:'
  - \breveal\s+(?:your\s+|the\s+)?(?:full\s+|entire\s+|complete\s+|hidden\s+)?system\s+prompt\b
capabilities:
- instruction-override
risk:
  title: Instruction Override
recommendation: Reject skill content that attempts to override system, safety, or
  operator instructions.
