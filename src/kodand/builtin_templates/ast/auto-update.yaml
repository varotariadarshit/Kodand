id: AST07-AUTO-UPDATE
info:
  name: Silent Auto-Update
  severity: medium
  confidence: medium
  category: AST07
detection:
  match:
  - silently update
  - update in the background
  regex:
  - (?:auto|self|silent(?:ly)?)[\s-]?(?:update|upgrad(?:e|ing))\b(?!\s+(?:the\s+|all\s+|obsolete\s+)?(?:jest\s+|vitest\s+)?snapshots?)
capabilities:
- update-drift
risk:
  title: Silent Auto-Update
recommendation: Require explicit, logged, and reviewed updates instead of silent self-update.
