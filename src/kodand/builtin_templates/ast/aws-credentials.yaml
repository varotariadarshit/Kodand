id: AST03-AWS-CREDENTIALS
info:
  name: AWS Credential Access
  severity: high
  confidence: high
  category: AST03
detection:
  match:
  - ~/.aws/credentials
  - .aws/credentials
  - aws_secret_access_key
  - aws_access_key_id
  regex:
  - AKIA[0-9A-Z]{16}
capabilities:
- credential-access
- filesystem-read
risk:
  title: AWS Credential Access
recommendation: Skills must not read AWS credential files or long-lived keys; use
  scoped roles.
