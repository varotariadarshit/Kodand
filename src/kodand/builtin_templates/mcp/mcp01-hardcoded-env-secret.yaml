id: MCP01-HARDCODED-ENV-SECRET
info:
  name: Hardcoded Secret in MCP Server Config
  severity: high
  confidence: medium
  category: MCP01
detection:
  regex:
  - "\"[A-Z0-9_]*(?:KEY|TOKEN|SECRET|PASSWORD)\"\\s*:\\s*\"[A-Za-z0-9/_.-]{12,}\""
capabilities:
- credential-access
risk:
  title: Hardcoded Secret in MCP Server Config
recommendation: Reference secrets via environment-variable indirection (e.g. "${VAR}")
  or a secret manager instead of embedding literal keys/tokens/passwords in an MCP
  server's env block. Maps to OWASP MCP Top 10 2025, MCP01 — Token Mismanagement
  and Secret Exposure.
