name: Release

# Runs when a version tag is pushed, e.g. `git tag v1.0.0 && git push origin v1.0.0`:
# checks the tag matches the package version, runs the tests and benchmark, builds the
# wheel and sdist, and creates a GitHub release with them attached and the notes taken
# from that version's CHANGELOG section. Kodand isn't published on PyPI; people install
# from the repository (./install.sh) or from a release's wheel.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version v$version"; exit 1; }
      - name: Test
        run: |
          pip install -e ".[dev]"
          pytest -q
          kodand bench --no-banner
      - name: Build
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release from this version's CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG section for $version"; exit 1; }
          gh release create "$GITHUB_REF_NAME" dist/* --title "Kodand $version" --notes-file notes.md
