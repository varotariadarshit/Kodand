[build-system]
requires=["setuptools>=77","wheel"]
build-backend="setuptools.build_meta"
[project]
name="kodand"
version="1.0.0"
description="Agentic AI Skills Threat and Risk Assessment: static security scanner for AI agent skills, MCP server configs and hooks"
readme="README.md"
license="MIT"
license-files=["LICENSE"]
authors=[{name="Darshit Varotaria"}]
keywords=["security","ai-security","mcp","model-context-protocol","agent-skills","claude-code","prompt-injection","sast","static-analysis","supply-chain"]
classifiers=[
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
requires-python=">=3.11.4"
dependencies=["pydantic>=2.7,<3","PyYAML>=6,<7","rich>=13.7,<15","typer>=0.12,<1","python-docx>=1.1,<2","reportlab>=4,<5"]
[project.optional-dependencies]
dev=["pytest>=8,<9","ruff>=0.6,<1"]
ui=["fastapi>=0.110,<1","uvicorn>=0.27,<1","python-multipart>=0.0.9"]
mcp=["mcp>=1.2,<2"]
code=["tree-sitter>=0.21,<1","tree-sitter-javascript>=0.21,<1","tree-sitter-typescript>=0.21,<1"]
all=["kodand[ui,mcp,code]"]
[project.urls]
Homepage="https://github.com/varotariadarshit/Kodand"
Documentation="https://github.com/varotariadarshit/Kodand/blob/master/USER_GUIDE.md"
Changelog="https://github.com/varotariadarshit/Kodand/blob/master/CHANGELOG.md"
Issues="https://github.com/varotariadarshit/Kodand/issues"
Security="https://github.com/varotariadarshit/Kodand/security/policy"
[project.scripts]
kodand="kodand.cli:app"
[tool.setuptools.packages.find]
where=["src"]
[tool.pytest.ini_options]
testpaths=["tests"]
pythonpath=["src"]
addopts="-q"
[tool.setuptools.package-data]
# "*" skips dotfiles, and every MCP/hook corpus sample is a .mcp.json or .claude/settings.json
kodand = ["builtin_templates/**/*.yaml","webui/static/*","builtin_corpus/**/*","builtin_corpus/**/.*","builtin_corpus/**/.claude/*"]
[tool.ruff]
target-version="py311"
line-length=200
[tool.ruff.lint]
select=["E","F","I","W"]
ignore=[
    "E701","E702","E703", # this codebase uses semicolon-chained one-liners deliberately
    "E401", # multiple imports per line, same style
    "E501", # many dense one-liners exceed any reasonable fixed width by design
]
[tool.ruff.lint.per-file-ignores]
"tests/*"=["F401","F841"]
"tests/test_webui_v3.py"=["E402"] # KODAND_HOME must be set before importing kodand.webui.server
"tests/test_webui_auth.py"=["E402"] # same: KODAND_HOME must be set before the server import
